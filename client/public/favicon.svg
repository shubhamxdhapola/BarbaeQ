<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Zinc Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Vibrant Indigo/Violet Brand Gradient for "Q" -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Top Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Indigo Drop Shadow -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="8"/>
  <rect x="28" y="28" width="456" height="228" rx="124" fill="url(#glowGrad)"/>

  <!-- 2. Stylized "Q" with Barber Scissor Slash Tail -->
  <g filter="url(#neonShadow)">
    <!-- Main "O" Body of the "Q" -->
    <path 
      d="M256 96 C168 96 104 164 104 252 C104 340 168 408 256 408 C344 408 408 340 408 252 C408 164 344 96 256 96 Z M256 160 C308 160 344 200 344 252 C344 304 308 344 256 344 C204 344 168 304 168 252 C168 200 204 160 256 160 Z" 
      fill="url(#brandGrad)"
      fill-rule="evenodd"
    />

    <!-- Tail of the "Q" (Sharp Barber Scissor Blade Slash) -->
    <path 
      d="M296 296 L416 416 C428 428 444 420 440 404 L424 336 L344 256 Z" 
      fill="url(#brandGrad)"
    />

    <!-- Small White Barber Pivot Accent Dot -->
    <circle cx="344" cy="344" r="14" fill="#ffffff" stroke="#4f46e5" stroke-width="4"/>
  </g>
</svg>
